# Type checking of the scripts in examples/:
#   uv run mypy --config-file mypy-examples.ini $(git ls-files 'examples/*.py')
[mypy]
python_version = 3.10
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
disable_error_code = valid-type, name-defined, has-type, used-before-def, var-annotated, override, assignment, empty-body
